name: Collect Azure snapshot

on:
  schedule:
    - cron: "0 21 * * 1,4"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: azure-pulse-publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      analysis-run-id: ${{ steps.await-analysis.outputs.run-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Sign in to Azure with OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Resource Graph extension
        run: az extension add --name resource-graph --only-show-errors
      - name: Collect directly into a sanitized candidate
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          OUTPUT_PATH: .candidate/snapshot.json
        run: npm run collect:azure
      - name: Validate candidate JSON Schema, runtime schema, evidence, and privacy
        run: |
          npx tsx scripts/validate-public-data.ts .candidate/snapshot.json
          npx tsx scripts/privacy-scan.ts .candidate
      - name: Refresh main and repeat candidate validation
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git merge --ff-only "origin/${{ github.event.repository.default_branch }}"
          npx tsx scripts/validate-public-data.ts .candidate/snapshot.json
          npx tsx scripts/privacy-scan.ts .candidate
      - name: Publish validated snapshot to main
        id: publish
        run: |
          cp .candidate/snapshot.json public/data/snapshot.json
          if git diff --quiet -- public/data/snapshot.json; then
            echo "No sanitized snapshot change."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          git commit -m "Publish sanitized Azure operations snapshot"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch AI analysis
        id: analysis
        # Skipped when the snapshot is byte-identical to the published one, which spares an agent run
        # that could only reproduce the insights already on the site. In practice the collection
        # timestamp changes every run, so this rarely skips; it is a guard against a pointless run,
        # not a budget control.
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          response=$(gh api -X POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ai-insights.lock.yml/dispatches" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -f "ref=$BRANCH" 2>&1) || true
          if [[ "$response" =~ \"workflow_run_id\"[[:space:]]*:[[:space:]]*([1-9][0-9]*) ]]; then
            echo "run-id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Dispatching the AI analysis did not report a run, so its insights cannot be published. Response: $response"
            exit 1
          fi
      # Deliberately not conditional on a new commit. If an earlier deployment failed, the branch
      # already carries data the site never received, and a later run that collects identical data
      # would skip the deployment and leave that mismatch in place forever.
      - name: Deploy to Pages and fail if the site does not receive this snapshot
        uses: ./.github/actions/await-pages-deployment
        with:
          branch: ${{ github.event.repository.default_branch }}
          github-token: ${{ github.token }}
      # The analysis runs under GITHUB_TOKEN, so its completion emits no workflow_run event and the
      # publisher that listens for one never starts. Waiting here and reporting the run to the
      # publishing job below is what turns the analysis from a run nobody reads into insights the
      # site actually serves.
      #
      # Deliberately not conditional on the deployment above succeeding. A failed deployment already
      # fails this job, and skipping the wait would strand an analysis that is about to succeed while
      # the publisher below could have deployed the site again and repaired it.
      - name: Await the AI analysis
        id: await-analysis
        if: ${{ !cancelled() && steps.analysis.outputs.run-id != '' }}
        uses: ./.github/actions/await-analysis-run
        with:
          run-id: ${{ steps.analysis.outputs.run-id }}
          github-token: ${{ github.token }}

  # Calling the publisher instead of dispatching it makes its validation, publication, and deployment
  # part of this run, so insights that never reach the site fail the collection rather than being
  # reported nowhere. A dispatched run could also be left queued indefinitely behind this one, which
  # shares its publication concurrency group.
  publish-insights:
    needs: collect
    # Runs even when the collection failed, because the only failure that can happen after the
    # analysis is dispatched is the site deployment, and publishing the insights deploys the site
    # again. The run stays red either way; a failed job cannot be cancelled into a green one.
    if: ${{ !cancelled() && needs.collect.outputs.analysis-run-id != '' }}
    permissions:
      actions: write
      contents: write
    uses: ./.github/workflows/publish-ai-insights.yml
    with:
      analysis-run-id: ${{ needs.collect.outputs.analysis-run-id }}
