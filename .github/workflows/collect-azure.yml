name: Collect Azure snapshot

on:
  schedule:
    - cron: "0 21 * * 1,4"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write

concurrency:
  group: azure-pulse-publication
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Sign in to Azure with OIDC
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Resource Graph extension
        run: az extension add --name resource-graph --only-show-errors
      - name: Collect directly into a sanitized candidate
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          OUTPUT_PATH: .candidate/snapshot.json
        run: npm run collect:azure
      - name: Validate candidate JSON Schema, runtime schema, evidence, and privacy
        run: |
          npx tsx scripts/validate-public-data.ts .candidate/snapshot.json
          npx tsx scripts/privacy-scan.ts .candidate
      - name: Refresh main and repeat candidate validation
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git merge --ff-only "origin/${{ github.event.repository.default_branch }}"
          npx tsx scripts/validate-public-data.ts .candidate/snapshot.json
          npx tsx scripts/privacy-scan.ts .candidate
      - name: Publish validated snapshot to main
        id: publish
        run: |
          cp .candidate/snapshot.json public/data/snapshot.json
          if git diff --quiet -- public/data/snapshot.json; then
            echo "No sanitized snapshot change."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          git commit -m "Publish sanitized Azure operations snapshot"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch AI analysis and Pages deployment
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ai-insights.lock.yml --ref "${{ github.event.repository.default_branch }}"
          gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
