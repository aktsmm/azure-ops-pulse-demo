name: Publish validated AI insights

on:
  workflow_run:
    workflows: ["Azure Ops Pulse evidence-bound analysis"]
    types: [completed]
  # An analysis dispatched with GITHUB_TOKEN completes without emitting a workflow_run event, because
  # GitHub only lets GITHUB_TOKEN create runs through workflow_dispatch and repository_dispatch. The
  # scheduled collection dispatches the analysis that way, so it calls this workflow directly rather
  # than waiting for an event that never arrives. See
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
  workflow_call:
    inputs:
      analysis-run-id:
        description: Run id of a successful analysis whose validated candidate should be published.
        required: true
        type: string

permissions:
  contents: read

# A called workflow evaluates this group in the caller's context, so sharing a group with the caller
# queues the call behind the very run that is waiting for it and the caller fails. Only the
# workflow_run entry point needs the shared slot; a call already runs inside the collection holding it.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'azure-pulse-publication' || format('azure-pulse-publication-nested-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  validate:
    # A call is only reachable from a workflow in this repository, and the run id it supplies is
    # verified in the first step below. Payloads from the workflow_run entry point are filtered here
    # and verified again there.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # The workflow_run trigger vouches for the run it reports, but a run id passed in by a caller is
      # just a number, so it is checked against the same conditions before anything it produced is
      # trusted. The workflow_run path is re-checked here too rather than trusting the job condition
      # alone.
      - name: Resolve and verify the analysis run
        id: analysis
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.analysis-run-id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          expected_path=.github/workflows/ai-insights.lock.yml
          reject() {
            echo "::error::Refusing to publish from run $RUN_ID: $1. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
            exit 1
          }
          case "$RUN_ID" in
            '' | *[!0-9]*)
              echo "::error::'$RUN_ID' is not an analysis run id."
              exit 1
              ;;
          esac
          summary=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            --jq '[.path, (.conclusion // "-"), .head_branch, .head_repository.full_name] | @tsv') ||
            reject "it could not be read"
          read -r path conclusion branch repo <<<"$summary" || true
          [ "$path" = "$expected_path" ] || reject "it is '$path', not $expected_path"
          [ "$conclusion" = success ] || reject "it finished as '$conclusion'"
          [ "$branch" = "$DEFAULT_BRANCH" ] || reject "it ran on '$branch', not $DEFAULT_BRANCH"
          [ "$repo" = "$GITHUB_REPOSITORY" ] || reject "it belongs to '$repo'"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Download validated candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: validated-ai-insights
          path: .candidate
          github-token: ${{ github.token }}
          run-id: ${{ steps.analysis.outputs.run-id }}
      - name: Verify candidate artifact scope
        run: |
          mapfile -t candidate_files < <(find .candidate -type f -printf '%P\n' | sort)
          if [ "${#candidate_files[@]}" -ne 1 ] || [ "${candidate_files[0]}" != "snapshot.json" ]; then
            printf 'Candidate artifact must contain only snapshot.json:\n'
            printf '%s\n' "${candidate_files[@]}"
            exit 1
          fi
          test ! -L .candidate/snapshot.json
          test "$(wc -c < .candidate/snapshot.json)" -le 1048576
      - name: Install deterministic validation dependencies
        run: npm ci --ignore-scripts
      - name: Repeat JSON Schema, runtime schema, Japanese, evidence, baseline, and privacy gates
        run: |
          npx tsx scripts/validate-public-data.ts .candidate/snapshot.json --insights-only --baseline=public/data/snapshot.json
          npx tsx scripts/privacy-scan.ts .candidate
      - name: Upload trusted candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-ai-insights
          path: .candidate/snapshot.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Download trusted candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-ai-insights
          path: .candidate
      - name: Publish validated AI insights to main
        id: publish
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git merge --ff-only "origin/${{ github.event.repository.default_branch }}"
          cp .candidate/snapshot.json public/data/snapshot.json
          if git diff --quiet -- public/data/snapshot.json; then
            echo "No validated AI insight change."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          git commit -m "Publish validated public AI insights"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "published=true" >> "$GITHUB_OUTPUT"
      # Deliberately not conditional on a new commit, so a deployment that failed earlier is
      # repaired instead of being hidden by a later run that happens to produce identical insights.
      - name: Deploy to Pages and fail if the site does not receive these insights
        uses: ./.github/actions/await-pages-deployment
        with:
          branch: ${{ github.event.repository.default_branch }}
          github-token: ${{ github.token }}
